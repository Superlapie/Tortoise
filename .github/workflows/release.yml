name: release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  validate-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Tortoise.slnx
      - name: Build
        run: dotnet build Tortoise.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Tortoise.slnx -c Release --no-build

  validate-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Tortoise.slnx
      - name: Build
        run: dotnet build Tortoise.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Tortoise.slnx -c Release --no-build

  release:
    needs: [validate-linux, validate-windows]
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    environment: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'

      - name: Derive release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if (-not $tag.StartsWith('v')) { throw "Tag must start with v" }
          $informational = $tag.Substring(1)
          if ($informational -match '^(\d+\.\d+\.\d+)') {
            $assembly = $matches[1]
          } else {
            throw "Tag must contain a numeric x.y.z version prefix (e.g. v0.1.0-alpha)"
          }
          echo "RELEASE_INFORMATIONAL_VERSION=$informational" >> $env:GITHUB_ENV
          echo "RELEASE_ASSEMBLY_VERSION=$assembly" >> $env:GITHUB_ENV

      - name: Publish WPF app
        shell: pwsh
        run: |
          dotnet publish src/Tortoise.App/Tortoise.App.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o artifacts/app `
            /p:Version=$env:RELEASE_INFORMATIONAL_VERSION `
            /p:AssemblyVersion=$env:RELEASE_ASSEMBLY_VERSION `
            /p:FileVersion=$env:RELEASE_ASSEMBLY_VERSION `
            /p:InformationalVersion=$env:RELEASE_INFORMATIONAL_VERSION

      - name: Publish CLI
        shell: pwsh
        run: |
          dotnet publish src/Tortoise.Cli/Tortoise.Cli.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o artifacts/cli `
            /p:Version=$env:RELEASE_INFORMATIONAL_VERSION `
            /p:AssemblyVersion=$env:RELEASE_ASSEMBLY_VERSION `
            /p:FileVersion=$env:RELEASE_ASSEMBLY_VERSION `
            /p:InformationalVersion=$env:RELEASE_INFORMATIONAL_VERSION

      - name: Stage portable bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/portable/app | Out-Null
          New-Item -ItemType Directory -Force -Path artifacts/portable/cli | Out-Null
          Copy-Item -Path artifacts/app/* -Destination artifacts/portable/app -Recurse
          Copy-Item -Path artifacts/cli/* -Destination artifacts/portable/cli -Recurse

      - name: Create package inventory
        shell: pwsh
        run: |
          dotnet list Tortoise.slnx package --format json > artifacts/dependencies.json

      - name: Create release archive
        shell: pwsh
        run: |
          $archive = "artifacts/Tortoise-${{ github.ref_name }}-win-x64.zip"
          Compress-Archive -Path artifacts/portable/* -DestinationPath $archive
          $hash = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -Path "artifacts/Tortoise-${{ github.ref_name }}-win-x64.sha256" -Value "$hash  $(Split-Path $archive -Leaf)"

      - name: Generate artifact attestation
        uses: actions/attest-build-provenance@96b4a1ef7235a096b17240c259729fdd70c83d45
        with:
          subject-path: artifacts/Tortoise-${{ github.ref_name }}-win-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65
        with:
          files: |
            artifacts/Tortoise-${{ github.ref_name }}-win-x64.zip
            artifacts/Tortoise-${{ github.ref_name }}-win-x64.sha256
            artifacts/dependencies.json
          generate_release_notes: true
