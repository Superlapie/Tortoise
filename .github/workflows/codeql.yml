name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'

jobs:
  analyze:
    runs-on: windows-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b16344ceabd3597fab798d83d2f
      - uses: actions/setup-dotnet@3fad03288982e6044aafaa77577593a74
        with:
          dotnet-version: '10.0.x'
      - uses: github/codeql-action/init@3a5d6a35aed3f1e2fe4de8ebacd03e17e8fc29f6
        with:
          languages: csharp
      - name: Build solution for CodeQL
        run: dotnet build Tortoise.slnx -c Release
      - uses: github/codeql-action/analyze@3a5d6a35aed3f1e2fe4de8ebacd03e17e8fc29f6
