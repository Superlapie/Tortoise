name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Tortoise.slnx
      - name: Build libraries
        run: dotnet build Tortoise.slnx -c Release --no-restore /p:BuildProjectReferences=true
      - name: Test
        run: dotnet test Tortoise.slnx -c Release --no-build --filter "Category!=Integration&Category!=HyperVIntegration" --logger "trx;LogFileName=linux-results.trx" --results-directory artifacts/test-results
      - name: Verification summary
        if: always()
        run: dotnet run --project tools/Tortoise.VerificationSummary -- --trx-root=artifacts/test-results --output-root=artifacts/verification --sha=${{ github.sha }} --os=Linux
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@4.3.4
        with:
          name: verification-linux
          path: artifacts/verification/
          if-no-files-found: ignore

  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Tortoise.slnx
      - name: Build
        run: dotnet build Tortoise.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Tortoise.slnx -c Release --no-build --filter "Category!=Integration&Category!=HyperVIntegration" --logger "trx;LogFileName=windows-results.trx" --results-directory artifacts/test-results
      - name: Verification summary
        if: always()
        shell: pwsh
        run: dotnet run --project tools/Tortoise.VerificationSummary -- --trx-root=artifacts/test-results --output-root=artifacts/verification --sha=$env:GITHUB_SHA --os=Windows
      - name: Upload verification artifacts
        if: always()
        uses: actions/upload-artifact@4.3.4
        with:
          name: verification-windows
          path: artifacts/verification/
          if-no-files-found: ignore
