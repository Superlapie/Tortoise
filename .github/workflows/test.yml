name: test

on:
  workflow_call:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Tortoise.slnx
      - name: Build
        run: dotnet build Tortoise.slnx -c Release --no-restore
      - name: Test
        run: dotnet test Tortoise.slnx -c Release --no-build
